<!DOCTYPE html>
<html lang="no">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>StyleGuide</title>
        
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="components/buttons.css">
        <link rel="stylesheet" href="components/cards.css">
        <link rel="stylesheet" href="components/icons.css">
        <link rel="stylesheet" href="components/navigation.css">
        <link rel="stylesheet" href="components/forms.css">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    </head>

    <body>
        <div class="app">

            <!--Top bar-->
            <header class="topbar">

                <!--Logo-->
                <a href="#">
                    <img class="logo" src="logo/LOGO_NAME_LIGHT_BG.png" alt="FinnTid">
                </a>

                <!--Profile-->
                <div class="profile">

                    <button class="profile-button" id="profileButton" aria-label="Profil">
                        <i class="bi bi-person-circle profile-icon"></i>
                    </button>

                    <div class="profile-menu" id="profileMenu">
                        <button class="profile-menu-item">
                            <i class="bi bi-pencil"></i>
                            Endre profil
                        </button>

                        <button class="profile-menu-item">
                            <i class="bi bi-box-arrow-right"></i>
                            Logg ut
                        </button>
                    </div>

                </div>

            </header>


            <div class="content">

                <!--Side bar-->
                <aside class="sidebar">

                    <div class="nav">
                        <!--Notifications-->
                        <a class="nav-item active" href="#">
                            <i class="bi bi-bell"></i>
                            <span>Varsler</span>
                        </a>

                        <!--Calendar-->
                        <a class="nav-item" href="#">
                            <i class="bi bi-calendar3"></i>
                            <span>Kalender</span>
                        </a>

                        <!--Invite to meeting-->
                        <a class="nav-item" href="#">
                            <i class="bi bi-people"></i>
                            <span>Innkalling</span>
                        </a>
                    </div>

                </aside>

                <main>
                    <!--Site name-->
                    <h1>STYLE GUIDE</h1>
                    <!--icons-->
                    <i class="bi bi-house-gear"></i>
                    <i class="bi bi-house-gear-fill"></i>

                    <i class="bi bi-person-fill-gear"></i>
                    <i class="bi bi-person-gear"></i>

                    <i class="bi bi-person-circle"></i>
                    <i class="bi bi-person-fill"></i>
                    <i class="bi bi-person"></i>

                    <i class="bi bi-people-fill"></i>
                    <i class="bi bi-people"></i>

                    <i class="bi bi-calendar3"></i>

                    <i class="bi bi-bell-fill"></i>
                    <i class="bi bi-bell"></i>

                    <i class="bi bi-person-workspace"></i>

                    <i class="bi-clipboard-check"></i>

                    <i class="bi bi-box-arrow-left"></i>
                    <i class="bi bi-box-arrow-left"></i>

                    <i class="bi bi-plus-lg"></i>

                    <i class="bi bi-pencil-fill"></i>
                    <i class="bi bi-pencil"></i>

                    <i class="bi bi-trash3-fill"></i>
                    <i class="bi bi-trash3"></i>

                    <i class="bi bi-three-dots-vertical"></i>
                    <i class="bi bi-three-dots"></i>

                    <i class="bi-chat-left-text"></i>
                    <i class="bi-flag"></i>
                    <i class="bi-exclamation-circle"></i>
                    <i class="bi-send"></i>
                    <i class="bi-megaphone"></i>

                    <i class="bi bi-clock-history"></i>
                    <i class="bi bi-check2"></i>
                    <i class="bi bi-exclamation-lg"></i>
                    <i class="bi bi-x-lg"></i>

                    <i class="bi bi-geo-alt"></i>
                    <i class="bi bi-geo-alt-fill"></i>


                    <!--buttons-->
                    <button class="btn btn-primary">Primary</button>
                    <button class="btn btn-primary" disabled>Primary disabled</button>

                    <button class="btn btn-secondary">Secondary</button>
                    <button class="btn btn-secondary" disabled>Secondary disabled</button>

                    <button class="btn btn-icon"><i class="bi bi-plus-lg"></i></button>
                    <button class="btn btn-icon" disabled><i class="bi bi-plus-lg"></i></button>


                    <!--Forms-->
                    <div class="form-group">
                        <label class="form-label" for="title">Input-felt</label>
                        <input class="form-input" id="title" type="text" placeholder="Skriv inn tittel">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="example-description">Input-område</label>
                        <textarea class="form-textarea" id="example-description" placeholder="Skriv inn beskrivelse"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="title">Dato-felt</label>
                        <input class="form-input" type="date">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="title">Tid-felt</label>
                        <input class="form-input" type="time">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="title">E-post-felt</label>
                        <input class="form-input" type="email">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="title">Passord-felt</label>
                        <input class="form-input" type="password">
                    </div>


                    <!--Cards-->
                    <div class="card">
                        <h3 class="card-title">Prosjektstatus</h3>

                        <div class="card-meta">12. september • 14:00–15:00</div>

                        <p class="card-description">Møterom A</p>

                        <div class="card-actions">
                            <button class="btn btn-primary">
                                Se detaljer
                            </button>
                        </div>
                    </div>

                    <div class="card">
                        <h3 class="card-title">Prosjektstatus</h3>

                        <div class="card-meta">
                            12. september • 14:00
                        </div>
                    </div>

                    <div class="card">
                        <p class="card-description">
                            Du har blitt invitert til et nytt møte.
                        </p>
                    </div>
                </main>    
            </div>

            <footer>
                <div id="footer-icon"><img src="logo/LOGO_LETTERS_LIGHT_BG.png" alt="FinnTid"></div>
                <div>&copy; 2026 FinnTid</div>
            </footer>
        </div>

        <!--Profile dropdown-->
        <script>
    const profileButton = document.getElementById("profileButton");
    const profileMenu = document.getElementById("profileMenu");

    profileButton.addEventListener("click", function () {
        profileMenu.classList.toggle("open");
    });
</script>
    </body>
</html>
